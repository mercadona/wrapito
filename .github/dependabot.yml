version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
    open-pull-requests-limit: 15
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # chalk is ESM-only from 5.0.0 (4.1.2 is the last CJS release). tsup
      # externalises it, so dist/index.cjs ships a bare require("chalk") that
      # breaks every CommonJS consumer. CI never runs the CJS bundle, so a
      # major bump lands green.
      - dependency-name: "chalk"
        update-types: ["version-update:semver-major"]
    groups:
      patches:
        applies-to: version-updates
        update-types:
          - "patch"
        patterns:
          - "*"
      minors:
        applies-to: version-updates
        update-types:
          - "minor"
        patterns:
          - "*"
      react:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "vite"
          - "@vitejs/*"
      eslint:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"
      testing:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
          - "@vitest/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns:
          - "*"
